<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absence Request Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; margin-bottom: 24px; }
    form.card { display: grid; gap: 10px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; }
    label { display: grid; gap: 4px; font-size: 14px; }
    input, textarea { padding: 8px; font: inherit; border: 1px solid #bbb; border-radius: 4px; }
    button, .btn { padding: 10px 18px; background: #1a73e8; color: #fff; border: 0; border-radius: 4px;
                   font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    .PENDING { color: #b06000; } .APPROVED { color: #1e8e3e; } .REJECTED { color: #d93025; }
  </style>
</head>
<body>
  <header>
    <h2>Absence Request Demo</h2>
    {% if email %}<span>{{ email }} · <a href="/logout">Sign out</a></span>{% endif %}
  </header>
  {% block content %}{% endblock %}
</body>
</html>
